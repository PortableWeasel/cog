<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 18: Observability / Trace Collection</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">cog-obs</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Provider</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Toolkit</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Trace File</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Core starts trace -->
  <line x1="100" y1="120" x2="250" y2="120" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="115" text-anchor="middle" font-size="10">cog_obs_trace_begin()</text>
  
  <!-- 2. Trace started -->
  <rect x="200" y="135" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="155" text-anchor="middle" font-size="10">trace_id = 12345</text>
  
  <!-- 3. Provider call traced -->
  <line x1="100" y1="175" x2="250" y2="175" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="170" text-anchor="middle" font-size="10">cog_obs_log_provider()</text>
  
  <!-- 4. Provider call -->
  <line x1="100" y1="195" x2="400" y2="195" stroke="#333" marker-end="url(#arrow)"/>
  <text x="250" y="190" text-anchor="middle" font-size="10">cog_provider_send()</text>
  
  <!-- 5. Log provider timing -->
  <line x1="400" y1="215" x2="250" y2="215" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="210" text-anchor="middle" font-size="10">timing: ttft=150ms</text>
  
  <!-- 6. Tool call traced -->
  <line x1="100" y1="235" x2="250" y2="235" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="230" text-anchor="middle" font-size="10">cog_obs_log_tool()</text>
  
  <!-- 7. Tool execution -->
  <line x1="100" y1="255" x2="550" y2="255" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="250" text-anchor="middle" font-size="10">cog_toolkit_exec()</text>
  
  <!-- 8. Log tool timing -->
  <line x1="550" y1="275" x2="250" y2="275" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="400" y="270" text-anchor="middle" font-size="10">timing: exec=50ms</text>
  
  <!-- 9. Trace ends -->
  <line x1="100" y1="295" x2="250" y2="295" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="290" text-anchor="middle" font-size="10">cog_obs_trace_end()</text>
  
  <!-- 10. Write trace -->
  <line x1="250" y1="315" x2="700" y2="315" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="310" text-anchor="middle" font-size="10">write trace.json</text>
  
  <!-- 11. Metrics -->
  <rect x="200" y="335" width="100" height="40" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="350" text-anchor="middle" font-size="10">metrics:</text>
  <text x="250" y="363" text-anchor="middle" font-size="9">tokens, cost, latency</text>
  
  <!-- 12. Diagnostics -->
  <rect x="200" y="385" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="405" text-anchor="middle" font-size="10">cog_obs_diag_dump()</text>
  
  <!-- 13. Dump state -->
  <line x1="250" y1="425" x2="700" y2="425" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="420" text-anchor="middle" font-size="10">write diag.json</text>
</svg>
