<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 15: Multi-Turn Conversation with Tool Calls</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">User</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Provider</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Toolkit</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Session</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- Turn 1: User question -->
  <line x1="100" y1="110" x2="250" y2="110" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="105" text-anchor="middle" font-size="10">"Search for X"</text>
  
  <!-- Core adds user msg -->
  <line x1="250" y1="130" x2="700" y2="130" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="125" text-anchor="middle" font-size="10">add user message</text>
  
  <!-- Core sends to provider -->
  <line x1="250" y1="150" x2="400" y2="150" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="145" text-anchor="middle" font-size="10">cog_provider_send()</text>
  
  <!-- Provider returns tool call -->
  <line x1="400" y1="170" x2="250" y2="170" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="165" text-anchor="middle" font-size="10">tool_call: search(X)</text>
  
  <!-- Core enqueues tool -->
  <rect x="200" y="185" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="205" text-anchor="middle" font-size="10">COG_EVENT_TOOL_CALL</text>
  
  <!-- Toolkit executes -->
  <line x1="250" y1="225" x2="550" y2="225" stroke="#333" marker-end="url(#arrow)"/>
  <text x="400" y="220" text-anchor="middle" font-size="10">cog_toolkit_exec()</text>
  
  <!-- Toolkit returns -->
  <line x1="550" y1="245" x2="250" y2="245" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="400" y="240" text-anchor="middle" font-size="10">search results</text>
  
  <!-- Core adds tool result -->
  <line x1="250" y1="265" x2="700" y2="265" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="260" text-anchor="middle" font-size="10">add tool result</text>
  
  <!-- Core sends to provider again -->
  <line x1="250" y1="285" x2="400" y2="285" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="280" text-anchor="middle" font-size="10">cog_provider_send()</text>
  
  <!-- Provider responds -->
  <line x1="400" y1="305" x2="250" y2="305" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="300" text-anchor="middle" font-size="10">"Here are results..."</text>
  
  <!-- Core adds assistant msg -->
  <line x1="250" y1="325" x2="700" y2="325" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="320" text-anchor="middle" font-size="10">add assistant message</text>
  
  <!-- Turn 2: User follow-up -->
  <line x1="100" y1="350" x2="250" y2="350" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="345" text-anchor="middle" font-size="10">"Summarize that"</text>
  
  <!-- Core gets history -->
  <line x1="250" y1="370" x2="700" y2="370" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="365" text-anchor="middle" font-size="10">cog_session_get_history()</text>
  
  <!-- History includes all -->
  <rect x="650" y="385" width="100" height="40" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="700" y="400" text-anchor="middle" font-size="10">history:</text>
  <text x="700" y="413" text-anchor="middle" font-size="9">user + tool + assistant + user</text>
  
  <!-- Send to provider -->
  <line x1="250" y1="435" x2="400" y2="435" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="430" text-anchor="middle" font-size="10">cog_provider_send(history)</text>
  
  <!-- Provider responds -->
  <line x1="400" y1="455" x2="250" y2="455" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="450" text-anchor="middle" font-size="10">summary</text>
  
  <!-- Add to session -->
  <line x1="250" y1="475" x2="700" y2="475" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="470" text-anchor="middle" font-size="10">add assistant message</text>
</svg>
