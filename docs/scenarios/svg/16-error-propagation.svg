<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 16: Error Propagation from Provider to UI</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Provider</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">State Machine</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">IPC</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">UI</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Provider error -->
  <rect x="50" y="110" width="100" height="40" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="100" y="125" text-anchor="middle" font-size="10">API error</text>
  <text x="100" y="138" text-anchor="middle" font-size="9">500 Internal Server Error</text>
  
  <!-- 2. Error to core -->
  <line x1="100" y1="160" x2="250" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="155" text-anchor="middle" font-size="10">cog_provider_error_t</text>
  <text x="175" y="168" text-anchor="middle" font-size="9">{code: -5, retryable: false}</text>
  
  <!-- 3. Core enqueues error event -->
  <rect x="200" y="180" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="250" y="200" text-anchor="middle" font-size="10">COG_EVENT_ERROR</text>
  
  <!-- 4. State machine handles -->
  <line x1="250" y1="220" x2="400" y2="220" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="215" text-anchor="middle" font-size="10">(AWAITING_LLM, ERROR)</text>
  
  <!-- 5. Transition to error state -->
  <rect x="350" y="235" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="400" y="255" text-anchor="middle" font-size="10">enter ERROR state</text>
  
  <!-- 6. Log error -->
  <rect x="350" y="270" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="400" y="290" text-anchor="middle" font-size="10">obs: log error</text>
  
  <!-- 7. Notify UI -->
  <line x1="400" y1="310" x2="550" y2="310" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="305" text-anchor="middle" font-size="10">cog_ipc_send(error)</text>
  
  <!-- 8. UI displays -->
  <line x1="550" y1="330" x2="700" y2="330" stroke="#333" marker-end="url(#arrow)"/>
  <text x="625" y="325" text-anchor="middle" font-size="10">show error message</text>
  
  <!-- 9. User decides -->
  <rect x="650" y="350" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="700" y="370" text-anchor="middle" font-size="10">user: retry?</text>
  
  <!-- 10. Retry or abort -->
  <line x1="700" y1="390" x2="400" y2="390" stroke="#333" marker-end="url(#arrow)"/>
  <text x="550" y="385" text-anchor="middle" font-size="10">COG_EVENT_RETRY or ABORT</text>
  
  <!-- 11. State machine transitions -->
  <rect x="350" y="410" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="400" y="430" text-anchor="middle" font-size="10">ERROR → IDLE or AWAITING_LLM</text>
</svg>
