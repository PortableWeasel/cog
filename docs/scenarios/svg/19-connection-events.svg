<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 19: Connection Event Stream for GUI Table</text>

  <!-- Actors -->
  <rect x="60" y="50" width="140" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="130" y="75" text-anchor="middle">Transport (cog-net)</text>

  <rect x="330" y="50" width="140" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">cog-obs</text>

  <rect x="600" y="50" width="140" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="670" y="75" text-anchor="middle">GUI Table</text>

  <!-- Lifelines -->
  <line x1="130" y1="90" x2="130" y2="580" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="580" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="670" y1="90" x2="670" y2="580" stroke="#999" stroke-dasharray="5,5"/>

  <!-- Config (setup) -->
  <rect x="280" y="105" width="240" height="35" fill="#e1f5ff" stroke="#333" rx="3"/>
  <text x="400" y="120" text-anchor="middle" font-size="10">cog_obs_config_t.conn_event_sink = gui_sink</text>
  <text x="400" y="133" text-anchor="middle" font-size="9">(set once at startup)</text>

  <!-- 1. OPEN -->
  <line x1="130" y1="160" x2="400" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="155" text-anchor="middle" font-size="10">conn_event_emit(OPEN, id=42)</text>
  <text x="265" y="147" text-anchor="middle" font-size="9">session=sess-abc, endpoint=api.openai.com</text>

  <line x1="400" y1="160" x2="670" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <text x="535" y="155" text-anchor="middle" font-size="10">sink(event)</text>

  <rect x="600" y="170" width="140" height="22" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="670" y="185" text-anchor="middle" font-size="10">add row: 42 CONNECTING</text>

  <!-- 2. CONNECTED -->
  <line x1="130" y1="215" x2="400" y2="215" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="210" text-anchor="middle" font-size="10">conn_event_emit(CONNECTED, id=42)</text>

  <line x1="400" y1="215" x2="670" y2="215" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="600" y="225" width="140" height="22" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="670" y="240" text-anchor="middle" font-size="10">row 42 → ACTIVE</text>

  <!-- 3. PROGRESS -->
  <line x1="130" y1="270" x2="400" y2="270" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="265" text-anchor="middle" font-size="10">conn_event_emit(PROGRESS, id=42)</text>
  <text x="265" y="257" text-anchor="middle" font-size="9">in_delta=512 out_delta=1024 in_total=512 out_total=1024</text>

  <line x1="400" y1="270" x2="670" y2="270" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="600" y="280" width="140" height="22" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="670" y="295" text-anchor="middle" font-size="10">row 42: ↑512 ↓1024</text>

  <!-- 4. More PROGRESS (accumulates) -->
  <line x1="130" y1="320" x2="400" y2="320" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="315" text-anchor="middle" font-size="10">conn_event_emit(PROGRESS, id=42)</text>
  <text x="265" y="307" text-anchor="middle" font-size="9">in_delta=256 out_delta=2048 in_total=768 out_total=3072</text>

  <line x1="400" y1="320" x2="670" y2="320" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="600" y="330" width="140" height="22" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="670" y="345" text-anchor="middle" font-size="10">row 42: ↑768 ↓3072</text>

  <!-- 5. STALLED -->
  <line x1="130" y1="375" x2="400" y2="375" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="370" text-anchor="middle" font-size="10">conn_event_emit(STALLED, id=42)</text>

  <line x1="400" y1="375" x2="670" y2="375" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="600" y="385" width="140" height="22" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="670" y="400" text-anchor="middle" font-size="10">row 42 → STALLED</text>

  <!-- 6. RETRY -->
  <line x1="130" y1="425" x2="400" y2="425" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="420" text-anchor="middle" font-size="10">conn_event_emit(RETRY, id=42, attempt=1)</text>

  <line x1="400" y1="425" x2="670" y2="425" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="600" y="435" width="140" height="22" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="670" y="450" text-anchor="middle" font-size="10">row 42: retry 1</text>

  <!-- 7. CLOSED -->
  <line x1="130" y1="475" x2="400" y2="475" stroke="#333" marker-end="url(#arrow)"/>
  <text x="265" y="470" text-anchor="middle" font-size="10">conn_event_emit(CLOSED, id=42, status=OK)</text>

  <line x1="400" y1="475" x2="670" y2="475" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="600" y="485" width="140" height="22" fill="#e1f5ff" stroke="#333" rx="3"/>
  <text x="670" y="500" text-anchor="middle" font-size="10">row 42 → CLOSED</text>

  <!-- Final table state -->
  <rect x="60" y="530" width="880" height="70" fill="#f8f9fa" stroke="#333" rx="5"/>
  <text x="80" y="548" font-size="11" font-weight="bold">Final GUI table:</text>
  <text x="80" y="566" font-size="10">conn_id | session  | endpoint        | model | ↑ bytes | ↓ bytes | total | state</text>
  <text x="80" y="582" font-size="10">42      | sess-abc | api.openai.com  | gpt-4 | 768     | 3072    | 3840  | CLOSED</text>
</svg>
