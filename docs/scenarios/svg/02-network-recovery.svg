<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 2: Network Stall → Detection → Recovery → Resume</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">cog-net</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">State Machine</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">UI Process</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">User</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. LLM call in flight -->
  <rect x="200" y="110" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="130" text-anchor="middle" font-size="10">LLM call in flight</text>
  <text x="250" y="143" text-anchor="middle" font-size="9">state=AWAITING_LLM</text>
  
  <!-- 2. Data stops -->
  <rect x="50" y="150" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="100" y="170" text-anchor="middle" font-size="10">data stops flowing</text>
  <text x="100" y="183" text-anchor="middle" font-size="9">(no error yet)</text>
  
  <!-- 3. Stall detection -->
  <rect x="50" y="195" width="100" height="40" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="100" y="210" text-anchor="middle" font-size="10">cog_net_poll()</text>
  <text x="100" y="223" text-anchor="middle" font-size="9">now-last_activity > timeout</text>
  
  <!-- 4. Network stall event -->
  <line x1="100" y1="245" x2="250" y2="245" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="240" text-anchor="middle" font-size="10">COG_EVENT_NETWORK_STALL</text>
  
  <!-- 5. State machine transition -->
  <line x1="250" y1="260" x2="400" y2="260" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="255" text-anchor="middle" font-size="10">(AWAITING_LLM, STALL)</text>
  
  <!-- 6. Enter degraded state -->
  <rect x="350" y="275" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="400" y="295" text-anchor="middle" font-size="10">enter DEGRADED</text>
  
  <!-- 7. Notify UI -->
  <line x1="400" y1="315" x2="550" y2="315" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="310" text-anchor="middle" font-size="10">notify: reconnecting</text>
  
  <!-- 8. UI shows indicator -->
  <line x1="550" y1="330" x2="700" y2="330" stroke="#333" marker-end="url(#arrow)"/>
  <text x="625" y="325" text-anchor="middle" font-size="10">show "reconnecting..."</text>
  
  <!-- 9. cog-net retries -->
  <rect x="50" y="350" width="100" height="40" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="100" y="365" text-anchor="middle" font-size="10">cog-net retries</text>
  <text x="100" y="378" text-anchor="middle" font-size="9">exponential backoff</text>
  
  <!-- 10. Connection restored -->
  <line x1="100" y1="400" x2="250" y2="400" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="395" text-anchor="middle" font-size="10">COG_EVENT_NETWORK_RECOVERED</text>
  
  <!-- 11. State machine recovery -->
  <line x1="250" y1="415" x2="400" y2="415" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="410" text-anchor="middle" font-size="10">(DEGRADED, RECOVERED)</text>
  
  <!-- 12. Resume -->
  <rect x="350" y="430" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="400" y="450" text-anchor="middle" font-size="10">resume AWAITING_LLM</text>
  
  <!-- 13. Notify UI recovery -->
  <line x1="400" y1="470" x2="550" y2="470" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="465" text-anchor="middle" font-size="10">notify: resumed</text>
  
  <!-- 14. UI clears indicator -->
  <line x1="550" y1="485" x2="700" y2="485" stroke="#333" marker-end="url(#arrow)"/>
  <text x="625" y="480" text-anchor="middle" font-size="10">clear indicator</text>
</svg>
