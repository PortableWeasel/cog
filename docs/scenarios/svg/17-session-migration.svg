<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 17: Session Migration Between Cores</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Orchestrator</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Aux Core 1</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Aux Core 2</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Session</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Session on aux 1 -->
  <rect x="350" y="110" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="400" y="130" text-anchor="middle" font-size="10">session on aux 1</text>
  
  <!-- 2. Load imbalance detected -->
  <rect x="200" y="150" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="250" y="170" text-anchor="middle" font-size="10">load imbalance</text>
  
  <!-- 3. Orchestrator decides -->
  <line x1="250" y1="190" x2="100" y2="190" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="185" text-anchor="middle" font-size="10">migrate session X</text>
  
  <!-- 4. Main approves -->
  <line x1="100" y1="210" x2="250" y2="210" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="205" text-anchor="middle" font-size="10">approve migration</text>
  
  <!-- 5. Serialize on aux 1 -->
  <line x1="250" y1="230" x2="400" y2="230" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="225" text-anchor="middle" font-size="10">cog_session_serialize()</text>
  
  <!-- 6. Session data -->
  <line x1="400" y1="250" x2="700" y2="250" stroke="#333" marker-end="url(#arrow)"/>
  <text x="550" y="245" text-anchor="middle" font-size="10">serialize tree</text>
  
  <!-- 7. Transfer to aux 2 -->
  <line x1="400" y1="270" x2="550" y2="270" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="265" text-anchor="middle" font-size="10">cog_ipc_send(serialized)</text>
  
  <!-- 8. Deserialize on aux 2 -->
  <line x1="550" y1="290" x2="700" y2="290" stroke="#333" marker-end="url(#arrow)"/>
  <text x="625" y="285" text-anchor="middle" font-size="10">cog_session_deserialize()</text>
  
  <!-- 9. Resume on aux 2 -->
  <rect x="500" y="310" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="550" y="330" text-anchor="middle" font-size="10">session resumed</text>
  
  <!-- 10. Update routing -->
  <line x1="250" y1="350" x2="100" y2="350" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="345" text-anchor="middle" font-size="10">update routing table</text>
  
  <!-- 11. Old session freed -->
  <rect x="350" y="370" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="400" y="390" text-anchor="middle" font-size="10">free old session</text>
  
  <!-- 12. Continue on aux 2 -->
  <rect x="500" y="410" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="550" y="430" text-anchor="middle" font-size="10">continue processing</text>
</svg>
