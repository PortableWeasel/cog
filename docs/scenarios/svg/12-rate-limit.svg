<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 12: Provider Rate Limit → Backoff → Queue</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Provider</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">cog-net</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">API Server</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">UI</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Core sends request -->
  <line x1="100" y1="120" x2="250" y2="120" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="115" text-anchor="middle" font-size="10">cog_provider_send()</text>
  
  <!-- 2. Provider to net -->
  <line x1="250" y1="140" x2="400" y2="140" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="135" text-anchor="middle" font-size="10">cog_net_send()</text>
  
  <!-- 3. Net to API -->
  <line x1="400" y1="160" x2="550" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="155" text-anchor="middle" font-size="10">HTTP POST</text>
  
  <!-- 4. 429 response -->
  <line x1="550" y1="180" x2="400" y2="180" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="475" y="175" text-anchor="middle" font-size="10">429 Too Many Requests</text>
  
  <!-- 5. Parse retry-after -->
  <rect x="350" y="195" width="100" height="40" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="400" y="210" text-anchor="middle" font-size="10">parse Retry-After</text>
  <text x="400" y="223" text-anchor="middle" font-size="9">retry_after_ms = 5000</text>
  
  <!-- 6. Return error -->
  <line x1="400" y1="245" x2="250" y2="245" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="240" text-anchor="middle" font-size="10">COG_ERROR_RATE_LIMITED</text>
  
  <!-- 7. Provider returns to core -->
  <line x1="250" y1="265" x2="100" y2="265" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="260" text-anchor="middle" font-size="10">cog_provider_error_t</text>
  
  <!-- 8. Core queues request -->
  <rect x="50" y="280" width="100" height="40" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="100" y="295" text-anchor="middle" font-size="10">queue request</text>
  <text x="100" y="308" text-anchor="middle" font-size="9">backoff: 5000ms</text>
  
  <!-- 9. Notify UI -->
  <line x1="100" y1="330" x2="700" y2="330" stroke="#333" marker-end="url(#arrow)"/>
  <text x="400" y="325" text-anchor="middle" font-size="10">"rate limited, retrying..."</text>
  
  <!-- 10. Wait and retry -->
  <rect x="50" y="350" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="100" y="370" text-anchor="middle" font-size="10">wait 5000ms</text>
  
  <!-- 11. Retry request -->
  <line x1="100" y1="390" x2="250" y2="390" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="385" text-anchor="middle" font-size="10">retry request</text>
  
  <!-- 12. Success -->
  <line x1="250" y1="410" x2="100" y2="410" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="175" y="405" text-anchor="middle" font-size="10">200 OK + stream</text>
</svg>
