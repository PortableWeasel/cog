<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 5: Graceful Shutdown with In-Flight Work</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Signal Handler</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Aux Cores</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Subagents</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Provider</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. SIGTERM received -->
  <rect x="50" y="110" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="100" y="130" text-anchor="middle" font-size="10">SIGTERM received</text>
  
  <!-- 2. Enqueue shutdown event -->
  <line x1="100" y1="150" x2="250" y2="150" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="145" text-anchor="middle" font-size="10">COG_EVENT_SHUTDOWN</text>
  
  <!-- 3. Core enters draining -->
  <rect x="200" y="165" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="250" y="185" text-anchor="middle" font-size="10">state = DRAINING</text>
  
  <!-- 4. Notify aux cores -->
  <line x1="250" y1="205" x2="400" y2="205" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="200" text-anchor="middle" font-size="10">cog_orchestrator_shutdown()</text>
  
  <!-- 5. Aux cores drain -->
  <rect x="350" y="220" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="400" y="240" text-anchor="middle" font-size="10">draining...</text>
  
  <!-- 6. Subagents finish -->
  <line x1="400" y1="260" x2="550" y2="260" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="255" text-anchor="middle" font-size="10">cancel or await</text>
  
  <!-- 7. Provider cancel -->
  <line x1="250" y1="280" x2="700" y2="280" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="275" text-anchor="middle" font-size="10">cog_provider_cancel()</text>
  
  <!-- 8. Wait for in-flight -->
  <rect x="200" y="300" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="250" y="320" text-anchor="middle" font-size="10">wait for in-flight</text>
  
  <!-- 9. Save session -->
  <rect x="200" y="335" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="355" text-anchor="middle" font-size="10">cog_session_save()</text>
  
  <!-- 10. Free resources -->
  <rect x="200" y="370" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="390" text-anchor="middle" font-size="10">cog_core_free()</text>
  
  <!-- 11. Exit -->
  <rect x="50" y="410" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="100" y="430" text-anchor="middle" font-size="10">exit(0)</text>
</svg>
