<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 8: Hot Config Reload</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Config File</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">cog-config</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Provider</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">In-Flight</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. File changed -->
  <rect x="50" y="110" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="100" y="130" text-anchor="middle" font-size="10">file modified</text>
  
  <!-- 2. Watcher detects -->
  <line x1="100" y1="150" x2="250" y2="150" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="145" text-anchor="middle" font-size="10">inotify / poll</text>
  
  <!-- 3. Reload config -->
  <rect x="200" y="165" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="185" text-anchor="middle" font-size="10">cog_config_reload()</text>
  
  <!-- 4. Diff old vs new -->
  <rect x="200" y="200" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="220" text-anchor="middle" font-size="10">diff configs</text>
  
  <!-- 5. Notify core -->
  <line x1="250" y1="240" x2="400" y2="240" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="235" text-anchor="middle" font-size="10">COG_EVENT_CONFIG_CHANGED</text>
  
  <!-- 6. Core applies safe changes -->
  <rect x="350" y="255" width="100" height="40" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="400" y="270" text-anchor="middle" font-size="10">apply safe changes</text>
  <text x="400" y="283" text-anchor="middle" font-size="9">(model, temp, etc)</text>
  
  <!-- 7. In-flight unaffected -->
  <rect x="650" y="300" width="100" height="30" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="700" y="320" text-anchor="middle" font-size="10">in-flight: no change</text>
  
  <!-- 8. New provider config -->
  <line x1="400" y1="340" x2="550" y2="340" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="335" text-anchor="middle" font-size="10">update provider config</text>
  
  <!-- 9. Next request uses new -->
  <rect x="500" y="360" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="550" y="380" text-anchor="middle" font-size="10">next req: new config</text>
  
  <!-- 10. Obs logs change -->
  <rect x="350" y="400" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="400" y="420" text-anchor="middle" font-size="10">obs: log change</text>
</svg>
