<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 10: Fan-Out/Fan-In Across Aux Cores</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Orchestrator</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Aux Core 1</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Aux Core 2</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Aux Core 3</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Main decides fan-out -->
  <rect x="50" y="110" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="100" y="130" text-anchor="middle" font-size="10">fan_out(3 tasks)</text>
  
  <!-- 2. Orchestrator places -->
  <line x1="100" y1="150" x2="250" y2="150" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="145" text-anchor="middle" font-size="10">cog_orchestrator_fan_out()</text>
  
  <!-- 3. Place on aux 1 -->
  <line x1="250" y1="170" x2="400" y2="170" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="165" text-anchor="middle" font-size="10">spawn task 1</text>
  
  <!-- 4. Place on aux 2 -->
  <line x1="250" y1="190" x2="550" y2="190" stroke="#333" marker-end="url(#arrow)"/>
  <text x="400" y="185" text-anchor="middle" font-size="10">spawn task 2</text>
  
  <!-- 5. Place on aux 3 -->
  <line x1="250" y1="210" x2="700" y2="210" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="205" text-anchor="middle" font-size="10">spawn task 3</text>
  
  <!-- 6. Tasks run in parallel -->
  <rect x="350" y="230" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="400" y="250" text-anchor="middle" font-size="10">task 1 running</text>
  
  <rect x="500" y="230" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="550" y="250" text-anchor="middle" font-size="10">task 2 running</text>
  
  <rect x="650" y="230" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="700" y="250" text-anchor="middle" font-size="10">task 3 running</text>
  
  <!-- 7. Results come back -->
  <line x1="400" y1="280" x2="250" y2="280" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="275" text-anchor="middle" font-size="10">result 1</text>
  
  <line x1="550" y1="295" x2="250" y2="295" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="400" y="290" text-anchor="middle" font-size="10">result 2</text>
  
  <line x1="700" y1="310" x2="250" y2="310" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="475" y="305" text-anchor="middle" font-size="10">result 3</text>
  
  <!-- 8. Orchestrator collects -->
  <rect x="200" y="330" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="350" text-anchor="middle" font-size="10">collect all results</text>
  
  <!-- 9. Fan-in to main -->
  <line x1="250" y1="370" x2="100" y2="370" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="365" text-anchor="middle" font-size="10">fan_in(results)</text>
  
  <!-- 10. Main continues -->
  <rect x="50" y="390" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="100" y="410" text-anchor="middle" font-size="10">continue with results</text>
</svg>
