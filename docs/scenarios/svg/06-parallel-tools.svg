<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 6: Parallel Tool Calls with Timeout</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Provider</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Toolkit</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Tool 1</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Tool 2</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="450" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Provider returns tool calls -->
  <line x1="100" y1="120" x2="250" y2="120" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="115" text-anchor="middle" font-size="10">tool_calls[]</text>
  
  <!-- 2. Core enqueues tool event -->
  <rect x="200" y="135" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="155" text-anchor="middle" font-size="10">COG_EVENT_TOOL_CALL</text>
  
  <!-- 3. Toolkit parallel start -->
  <line x1="250" y1="175" x2="400" y2="175" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="170" text-anchor="middle" font-size="10">cog_toolkit_exec_parallel()</text>
  
  <!-- 4. Tool 1 starts -->
  <line x1="400" y1="195" x2="550" y2="195" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="190" text-anchor="middle" font-size="10">start tool 1</text>
  
  <!-- 5. Tool 2 starts -->
  <line x1="400" y1="215" x2="700" y2="215" stroke="#333" marker-end="url(#arrow)"/>
  <text x="550" y="210" text-anchor="middle" font-size="10">start tool 2</text>
  
  <!-- 6. Tool 1 completes -->
  <line x1="550" y1="250" x2="400" y2="250" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="475" y="245" text-anchor="middle" font-size="10">result 1</text>
  
  <!-- 7. Tool 2 timeout -->
  <rect x="650" y="265" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="700" y="285" text-anchor="middle" font-size="10">timeout!</text>
  
  <!-- 8. Toolkit collects -->
  <rect x="350" y="300" width="100" height="40" fill="#fff3cd" stroke="#333" rx="3"/>
  <text x="400" y="315" text-anchor="middle" font-size="10">cog_toolkit_collect()</text>
  <text x="400" y="328" text-anchor="middle" font-size="9">results[2] = {ok, timeout}</text>
  
  <!-- 9. Results to core -->
  <line x1="400" y1="350" x2="250" y2="350" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="345" text-anchor="middle" font-size="10">COG_EVENT_TOOL_RESULT</text>
  
  <!-- 10. Send to provider -->
  <line x1="250" y1="370" x2="100" y2="370" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="365" text-anchor="middle" font-size="10">tool results</text>
  
  <!-- 11. Continue conversation -->
  <rect x="200" y="390" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="410" text-anchor="middle" font-size="10">continue loop</text>
</svg>
