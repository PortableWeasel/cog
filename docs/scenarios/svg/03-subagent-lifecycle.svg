<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold">Scenario 3: Subagent Lifecycle</text>
  
  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="100" y="75" text-anchor="middle">Parent Agent</text>
  
  <rect x="200" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="250" y="75" text-anchor="middle">Main Core</text>
  
  <rect x="350" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="400" y="75" text-anchor="middle">Orchestrator</text>
  
  <rect x="500" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="550" y="75" text-anchor="middle">Aux Core</text>
  
  <rect x="650" y="50" width="100" height="40" fill="#e1f5ff" stroke="#333" rx="5"/>
  <text x="700" y="75" text-anchor="middle">Subagent</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  <line x1="700" y1="90" x2="700" y2="500" stroke="#999" stroke-dasharray="5,5"/>
  
  <!-- 1. Parent spawns subagent -->
  <line x1="100" y1="120" x2="250" y2="120" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="115" text-anchor="middle" font-size="10">spawn_subagent(prompt)</text>
  
  <!-- 2. Core creates agent -->
  <rect x="200" y="135" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="250" y="155" text-anchor="middle" font-size="10">cog_agent_new()</text>
  
  <!-- 3. Orchestrator places agent -->
  <line x1="250" y1="180" x2="400" y2="180" stroke="#333" marker-end="url(#arrow)"/>
  <text x="325" y="175" text-anchor="middle" font-size="10">cog_orchestrator_place()</text>
  
  <!-- 4. Aux core spawns -->
  <line x1="400" y1="195" x2="550" y2="195" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="190" text-anchor="middle" font-size="10">spawn on aux core</text>
  
  <!-- 5. Subagent created -->
  <line x1="550" y1="210" x2="700" y2="210" stroke="#333" marker-end="url(#arrow)"/>
  <text x="625" y="205" text-anchor="middle" font-size="10">cog_agent_new()</text>
  
  <!-- 6. Subagent runs -->
  <rect x="650" y="225" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="700" y="245" text-anchor="middle" font-size="10">agent loop runs</text>
  
  <!-- 7. Status updates -->
  <line x1="700" y1="270" x2="550" y2="270" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="625" y="265" text-anchor="middle" font-size="10">COG_EVENT_AGENT_STATUS</text>
  
  <!-- 8. Status to parent -->
  <line x1="550" y1="285" x2="250" y2="285" stroke="#333" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="400" y="280" text-anchor="middle" font-size="10">status update</text>
  
  <!-- 9. Subagent completes -->
  <rect x="650" y="310" width="100" height="30" fill="#d4edda" stroke="#333" rx="3"/>
  <text x="700" y="330" text-anchor="middle" font-size="10">task complete</text>
  
  <!-- 10. Result to aux -->
  <line x1="700" y1="355" x2="550" y2="355" stroke="#333" marker-end="url(#arrow)"/>
  <text x="625" y="350" text-anchor="middle" font-size="10">COG_EVENT_AGENT_DONE</text>
  
  <!-- 11. Result to main -->
  <line x1="550" y1="370" x2="250" y2="370" stroke="#333" marker-end="url(#arrow)"/>
  <text x="400" y="365" text-anchor="middle" font-size="10">cog_agent_result()</text>
  
  <!-- 12. Result to parent -->
  <line x1="250" y1="385" x2="100" y2="385" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="380" text-anchor="middle" font-size="10">result returned</text>
  
  <!-- 13. Cleanup -->
  <rect x="650" y="410" width="100" height="30" fill="#f8d7da" stroke="#333" rx="3"/>
  <text x="700" y="430" text-anchor="middle" font-size="10">cog_agent_free()</text>
  
  <!-- 14. Aux cleanup -->
  <line x1="550" y1="455" x2="400" y2="455" stroke="#333" marker-end="url(#arrow)"/>
  <text x="475" y="450" text-anchor="middle" font-size="10">cog_agent_free()</text>
  
  <!-- 15. Main cleanup -->
  <line x1="250" y1="470" x2="100" y2="470" stroke="#333" marker-end="url(#arrow)"/>
  <text x="175" y="465" text-anchor="middle" font-size="10">cog_agent_free()</text>
</svg>
